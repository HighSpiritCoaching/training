<!doctype html>
<html lang="de">
<head>
<title>High Spirit</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="High Spirit">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#080b13">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>
  // Android: Manifest für "App installieren" (Schlüssel merkt sich die App selbst).
  // iPhone bekommt keins, sonst ginge beim Ablegen der persönliche Link verloren.
  if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l); }
</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* Layout: eine Handy-Spalte, dunkle Kopfleiste wie die HSC-Banner, unten 4 Reiter. Gelb = dein Feld, wie in der Tabelle. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --ink: #141a26; --muted: #5d6779; --line: #dde2ea;
  --brand: #1b1f2a; --brand-ink: #f4f6fa; --accent: #1f6fd1; --accent-ink: #ffffff;
  --mine: #fff4b8; --mine-line: #e6d36a; --ok: #1e8449; --bad: #b8322a; --bad-bg: #fbeae8;
  --t-gym: #d9ead3; --s-gym: #4f8a3c; --t-plyo: #d0ece7; --s-plyo: #2f8c7c;
  --t-sprint: #fff2cc; --s-sprint: #b8901c; --t-track: #cfe2f3; --s-track: #1f6fd1;
  --t-none: #eceff4; --s-none: #8a93a3;
  --f-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --r: 14px; --logo-filter: none; --logo-blend: multiply;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e121a; --surface: #171c27; --ink: #e8ecf3; --muted: #9aa4b5; --line: #2a3142;
  --brand: #080a0f; --brand-ink: #f4f6fa; --accent: #5b9bef; --accent-ink: #08101c;
  --mine: #3b3418; --mine-line: #6b5d22; --ok: #4cc27a; --bad: #ef7d74; --bad-bg: #3a1c1a;
  --t-gym: #1f3324; --s-gym: #7cc463; --t-plyo: #193330; --s-plyo: #5fd0bb;
  --t-sprint: #3a331b; --s-sprint: #e6c25a; --t-track: #1a2c41; --s-track: #6aa8f5;
  --t-none: #222836; --s-none: #8a93a3; --logo-filter: invert(.92); --logo-blend: screen; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #171c27; --ink: #e8ecf3; --muted: #9aa4b5; --line: #2a3142;
  --brand: #080a0f; --brand-ink: #f4f6fa; --accent: #5b9bef; --accent-ink: #08101c;
  --mine: #3b3418; --mine-line: #6b5d22; --ok: #4cc27a; --bad: #ef7d74; --bad-bg: #3a1c1a;
  --t-gym: #1f3324; --s-gym: #7cc463; --t-plyo: #193330; --s-plyo: #5fd0bb;
  --t-sprint: #3a331b; --s-sprint: #e6c25a; --t-track: #1a2c41; --s-track: #6aa8f5;
  --t-none: #222836; --s-none: #8a93a3; --logo-filter: invert(.92); --logo-blend: screen; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 400 16px/1.4 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Kopf */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--brand-ink); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.mark { flex: none; width: 46px; height: 46px; border-radius: 10px; }
.logo { display: block; width: min(260px, 70%); margin: 10px auto 0; opacity: .85; filter: var(--logo-filter); mix-blend-mode: var(--logo-blend); }
.who { flex: 1; min-width: 0; }
.who b { display: block; font: 800 19px/1.15 var(--f-display); }
.who span { font-size: 14px; opacity: .75; }
.status { flex: none; font: 600 13px/1 var(--f-num); letter-spacing: .04em; text-transform: uppercase; padding: 6px 9px; border-radius: 99px; background: rgba(255,255,255,.1); }
.status.err { background: var(--bad); color: #fff; }
.install { background: var(--accent); color: var(--accent-ink); font-size: 15px; }
.install .wrap { padding-block: 12px; display: grid; gap: 6px; }
.install ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.install button { justify-self: start; border: 1px solid currentColor; background: none; color: inherit; border-radius: 99px; padding: 6px 14px; font-weight: 600; }
.demo { background: var(--mine); color: var(--ink); font-size: 14px; }
.demo .wrap { padding-block: 8px; }

main { padding-block: 16px 110px; display: grid; gap: 14px; }
h2 { margin: 6px 0 0; font: 800 15px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card-h h3 { margin: 0; font: 800 18px/1.2 var(--f-display); }
.card-h small { color: var(--muted); font-size: 14px; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 4px 0; }

/* Trainingseinheit */
.unit { --tint: var(--t-none); --stripe: var(--s-none); background: var(--tint); border-radius: 12px; padding: 12px 12px 10px 16px; position: relative; display: grid; gap: 6px; min-width: 0; }
.unit::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 5px; border-radius: 0 4px 4px 0; background: var(--stripe); }
.unit.gym { --tint: var(--t-gym); --stripe: var(--s-gym); }
.unit.plyo { --tint: var(--t-plyo); --stripe: var(--s-plyo); }
.unit.sprint { --tint: var(--t-sprint); --stripe: var(--s-sprint); }
.unit.track { --tint: var(--t-track); --stripe: var(--s-track); }
.unit-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.half { font: 700 13px/1 var(--f-num); letter-spacing: .08em; padding: 5px 7px; border-radius: 6px; background: var(--surface); color: var(--ink); }
.unit-h h4 { margin: 0; font: 800 17px/1.2 var(--f-display); flex: 1; min-width: 0; }
.sets { font: 700 15px/1 var(--f-num); color: var(--muted); white-space: nowrap; }
.mytime { font-size: 14px; color: var(--muted); }
.ex { list-style: none; margin: 0; padding: 0; display: grid; }
.ex li { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; padding: 7px 0; border-top: 1px solid color-mix(in srgb, var(--stripe) 22%, transparent); }
.ex li:first-child { border-top: 0; }
.ex .s { font: 700 18px/1.2 var(--f-num); font-variant-numeric: tabular-nums; }
.ex .n { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.ex .m { grid-column: 2; font: 500 15px/1.2 var(--f-num); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.ex li[data-ab] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ex li.ab > * { opacity: .35; transition: opacity .2s; }
.ex li.ab .n { text-decoration: line-through; }
.ex li.ab .s { opacity: 1; font-size: 0; }
.ex li.ab .s::before { content: '✓'; font-size: 18px; color: var(--accent); }
.ex li.note { grid-template-columns: 1fr; font-style: italic; color: var(--muted); }
.hint { white-space: pre-line; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 9px 11px; font-size: 15px; }
.hint b { font-family: var(--f-num); letter-spacing: .05em; text-transform: uppercase; font-size: 13px; color: var(--muted); display: block; }
a.link { color: var(--accent); font-weight: 600; }

/* Wochenwahl */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Woche */
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.day > button { width: 100%; display: grid; grid-template-columns: 52px 1fr 20px; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 12px 14px; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dnum { display: grid; justify-items: center; line-height: 1; }
.dnum b { font: 700 13px/1 var(--f-num); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dnum span { font: 700 26px/1.05 var(--f-num); font-variant-numeric: tabular-nums; }
.slots { display: grid; gap: 4px; min-width: 0; }
.slot { display: flex; gap: 8px; align-items: center; font-size: 15px; min-width: 0; }
.slot i { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--s-none); }
.slot i.gym { background: var(--s-gym); } .slot i.plyo { background: var(--s-plyo); } .slot i.sprint { background: var(--s-sprint); } .slot i.track { background: var(--s-track); }
.slot .h { font: 700 13px/1 var(--f-num); color: var(--muted); width: 22px; flex: none; }
.slot .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chev { color: var(--muted); transition: transform .15s; }
.day.open .chev { transform: rotate(90deg); }
.day-body { padding: 0 14px 14px; display: grid; gap: 10px; }
.tag { font: 700 12px/1 var(--f-num); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; background: var(--bad-bg); color: var(--bad); }

/* Zeiten */
.grid { display: grid; grid-template-columns: 44px 1fr 1fr; gap: 8px; align-items: stretch; }
.grid .gh { font: 700 13px/1 var(--f-num); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 2px; }
.grid .gd { display: grid; align-content: center; justify-items: center; line-height: 1; }
.grid .gd b { font: 700 15px/1 var(--f-num); }
.grid .gd span { font: 500 13px/1.2 var(--f-num); color: var(--muted); }
.cell { min-height: 54px; border-radius: 10px; border: 1px dashed var(--line); background: var(--surface); padding: 6px 8px; text-align: left; display: grid; align-content: center; gap: 2px; min-width: 0; }
.cell.filled { background: var(--mine); border: 1px solid var(--mine-line); }
.cell.none { background: var(--surface); border-style: solid; color: var(--muted); }
.cell .v { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.cell .p { font: 600 12px/1 var(--f-num); letter-spacing: .04em; text-transform: uppercase; color: var(--ok); }
.cell.changed { box-shadow: 0 0 0 2px var(--accent); }
.cell.hs { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border: 1px solid var(--accent); }
.cell .n { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .o { font: 700 11px/1 var(--f-num); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.sec { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.wide { flex: 1 1 180px; }
.btn:disabled { opacity: .5; }

/* Werte */
.group { display: grid; gap: 0; }
.val { display: grid; grid-template-columns: 1fr 110px; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.card-h + .val { border-top: 0; }
.messen { display: grid; background: var(--surface); border-radius: 10px; padding: 6px 10px 4px; }
.messen > b { font: 700 12px/1.4 var(--f-num); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.messen .val:first-of-type, .card > .val.mess:first-child { border-top: 0; }
.ex li.feld { grid-template-columns: 1fr; padding: 0 0 4px; border-top: 0; }
.ex li.feld .val { background: var(--surface); border-radius: 10px; padding: 8px 10px; border-top: 0; }
.ex.zeit li.ss { border-left: 3px solid var(--stripe); padding-left: 6px; }
.ex.zeit li.ende { margin-bottom: 8px; }
.ex .n.mitvid { display: flex; align-items: center; gap: 10px; }
.ex .n.mitvid > span { flex: 1; min-width: 0; }
.play { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.play svg { width: 13px; height: 13px; margin-left: 2px; fill: currentColor; }
.unit-h .dauer { flex-basis: 100%; font: 600 14px/1.2 var(--f-num); color: var(--muted); }
.zoek { justify-self: start; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 6px 12px; font: 600 14px/1 var(--f-num); }
.zoek[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.inp .ro { width: 100%; text-align: right; font: 700 19px/1 var(--f-num); padding: 10px 2px; font-variant-numeric: tabular-nums; }
.switch + .switch { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.switch input.warn:checked { background: #e0a100; }
.folge { grid-column: 1 / -1; margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
.std { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; margin-top: 2px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
.std small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.std .box { flex: none; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; font-size: 15px; line-height: 1; }
.std.on { border-color: var(--ok, #2e7d32); }
.std.on .box { background: var(--ok, #2e7d32); border-color: var(--ok, #2e7d32); color: #fff; }
.std.warn { border-color: #e0a100; background: rgba(224,161,0,.08); }
.std.warn .box { border-color: #e0a100; }
.val label { font-weight: 600; min-width: 0; }
.val label small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
.inp { display: flex; align-items: center; gap: 6px; }
.inp input { width: 100%; min-width: 0; border: 1px solid var(--mine-line); background: var(--mine); border-radius: 10px; padding: 10px; font: 700 19px/1 var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
.inp u { text-decoration: none; font: 500 14px/1.1 var(--f-num); color: var(--muted); width: 0; flex: 0 0 auto; }
.unit-l { grid-column: 2; font: 500 13px/1 var(--f-num); color: var(--muted); text-align: right; }
.last { grid-column: 1 / -1; font: 500 14px/1.2 var(--f-num); color: var(--muted); }
.last { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.vbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font: 600 14px/1 var(--f-body); color: var(--accent); flex: none; }
.check { grid-column: 1 / -1; background: var(--mine); border: 1px solid var(--mine-line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; font-size: 15px; }
.chart { grid-column: 1 / -1; display: grid; gap: 6px; padding-top: 4px; }
.chart-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.delta { font: 700 16px/1.2 var(--f-num); color: var(--muted); }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font: 600 14px/1 var(--f-num); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.cline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.ca { fill: var(--accent); opacity: .12; }
.c0 { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 4; }
.cdot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.cdot.end { fill: var(--accent); }
.cl { font: 700 13px var(--f-num); fill: var(--ink); }
.cx { font: 500 12px var(--f-num); fill: var(--muted); }

/* Befinden */
.field { display: grid; gap: 6px; }
.field > span { font-weight: 600; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mine-in { width: 100%; border: 1px solid var(--mine-line); background: var(--mine); border-radius: 10px; padding: 10px 12px; font-size: 17px; }
.num-in { font: 700 20px/1 var(--f-num); }
.step { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; }
.step button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font: 700 20px/1 var(--f-num); }
.step input { text-align: center; }
.feel { display: flex; gap: 6px; flex-wrap: wrap; }
.feel button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 12px; font-weight: 600; }
.feel button[aria-pressed="true"] { background: var(--mine); border-color: var(--mine-line); }
textarea.mine-in { min-height: 64px; resize: vertical; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch input { appearance: none; width: 52px; height: 30px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked { background: var(--bad); }
.switch input:checked::after { transform: translateX(22px); }
.done { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.done button { border: 0; border-left: 1px solid var(--line); background: none; padding: 8px 4px; font: 600 15px/1 var(--f-num); letter-spacing: .02em; white-space: nowrap; }
.done button:first-child { border-left: 0; }
.done button.voll[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.done button.reduziert[aria-pressed="true"] { background: var(--mine); border-color: var(--mine-line); }
.done button.ausgefallen[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
/* Videoanalyse oben auf Heute */
.video { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--brand); color: var(--brand-ink); border-radius: var(--r); padding: 12px 14px; max-height: 240px; overflow: hidden;
  transition: opacity .35s ease, transform .35s ease, max-height .4s ease .3s, padding .4s ease .3s, margin .4s ease .3s; }
.video .vtxt { display: grid; gap: 2px; min-width: 0; }
.video .vtxt span { font: 700 12px/1 var(--f-num); letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.video .vtxt b { font-size: 16px; overflow-wrap: anywhere; }
.video .vtxt small { font-size: 13px; opacity: .7; }
.vok { border: 0; border-radius: 99px; background: var(--accent); color: #fff; font: 700 15px/1 var(--f-body); padding: 11px 15px; white-space: nowrap; transition: background .2s, transform .2s; }
.vok:active { transform: scale(.95); }
.video.ok .vok { background: var(--ok); transform: scale(1.06); }
.video.weg { opacity: 0; transform: scale(.97); max-height: 0; padding-block: 0; margin-bottom: -14px; }
.konfetti { position: fixed; z-index: 40; width: 8px; height: 10px; border-radius: 2px; pointer-events: none; }
/* Termine */
.termin { width: 100%; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.termin.hl { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.termin.vorbei { opacity: .6; }

<script>
(function () {
  const TAGE_KURZ = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const ANGELEITET = ['Schulsport', 'BMX-Bahn', 'Kraftkammer'];
  const INTENSITAET = ['intensiv', 'mittel', 'locker'];
  // Training erledigt? Nur die Auswahl, die Auswertung in % sieht nur Hannes.
  const ERLEDIGT = [['voll', '✓ Voll'], ['reduziert', '½ Reduziert'], ['ausgefallen', '✕ Ausgefallen']];
  const WUNSCH = ['Gym', 'Plyos', 'Sprints', 'Grundlage/Ausdauer', 'BMX-Track', 'Regeneration', 'Dehnen/Mobility', 'Kurztraining (wenig Zeit)'];
  const TERMIN_ARTEN = ['Rennen', 'Camp', 'Sonstiges'];
  const TERMIN_WICHTIG = ['Saison-Highlight', 'Sehr wichtig', 'Mäßig'], TERMIN_INTENSITAET = ['hoch', 'mittel', 'gering'];
  const mitWichtig = art => art === 'Rennen' || art === 'Sonstiges', mitIntensitaet = art => !!art && art !== 'Rennen';
  const terminStufen = t => [mitWichtig(t.art) && t.wichtig, mitIntensitaet(t.art) && t.intensitaet && 'Intensität ' + t.intensitaet].filter(Boolean).join(' · ');
  const MON_KURZ = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  // Adresse des Google-Skripts (Bereitstellen → Web-App-URL). Bleibt gleich, solange nur "Neue Version" bereitgestellt wird.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwybzfE0TMqvge98_Q3PMF_ZnP4q3zyIKHXGNYH52ovo4w_5kGLe1qTj-b9zXq1XLtp/exec';
  const echt = !window.DEMO;
  const S = { hinweise: {}, pruef: {}, modus: {}, chartOffen: '', k: '', d: null, tab: 'heute', wocheW: '', wocheZ: '', offen: {}, wartet: {}, timer: null, geaendert: {}, meta: {}, gezeigt: {}, zoek: {} };
  const $ = (sel, el) => (el || document).querySelector(sel);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- Verbindung zum Google-Skript (oder Vorschau) ----------
  function api(fn) {
    const args = [].slice.call(arguments, 1);
    if (echt) {
      let anfrage;
      if (!/^(start|woche|verlauf)$/.test(fn)) S.bearbeitet = true;
      if (fn === 'speichern') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0], woche: args[1], aenderungen: args[2] }) });
      else if (fn === 'standardSpeichern') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0], werte: args[1] }) });
      else if (fn === 'termin') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0], termin: args[1] }) });
      else if (fn === 'terminLoeschen') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0], id: args[1] }) });
      else if (fn === 'bedingung') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0], woche: args[1], bereich: args[2], name: args[3], erfuellt: args[4] }) });
      else if (fn === 'flach') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0], datum: args[1], bereich: args[2], name: args[3], flach: args[4] }) });
      else if (fn === 'befinden') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0], datum: args[1], status: args[2], an: args[3] }) });
      else if (fn === 'voiceGesendet') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0] }) });
      else if (fn === 'videoGesendet') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0], id: args[1] }) });
      else if (fn === 'erledigt') anfrage = fetch(APP_URL, { method: 'POST', body: JSON.stringify({ a: fn, k: args[0], datum: args[1], halbtag: args[2], titel: args[3], status: args[4] }) });
      else anfrage = fetch(APP_URL + '?a=' + fn + '&k=' + encodeURIComponent(args[0]) + (fn === 'woche' ? '&name=' + encodeURIComponent(args[1]) : ''));
      return anfrage
        .catch(() => { throw new Error('Keine Verbindung. Bist du online?'); })
        .then(r => r.json())
        .then(r => { if (!r.ok) throw new Error(r.fehler); return r.daten; });
    }
    return new Promise(ok => setTimeout(() => {
      if (fn === 'start') ok(JSON.parse(JSON.stringify(window.DEMO.start)));
      else if (fn === 'verlauf') ok(JSON.parse(JSON.stringify(window.DEMO.verlauf || {})));
      else if (fn === 'woche') ok(JSON.parse(JSON.stringify(window.DEMO.mehr[args[1]] || { name: args[1], alt: true })));
      else ok({ ok: true });
    }, fn === 'start' ? 250 : 350));
  }

  // ---------- Datum ----------
  const isoDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const toIso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const plusTage = (iso, n) => { const d = isoDate(iso); d.setDate(d.getDate() + n); return toIso(d); };
  const kurzDatum = iso => { const d = isoDate(iso); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };
  const langDatum = iso => { const d = isoDate(iso); return ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'][d.getDay()] + ', ' + d.getDate() + '. ' + MONATE[d.getMonth()]; };

  function finde(iso) {
    for (const name in S.d.daten) {
      const w = S.d.daten[name];
      if (!w.tage) continue;
      const i = w.tage.findIndex(t => t.datum === iso);
      if (i >= 0) return { w: w, t: w.tage[i], i: i };
    }
    return null;
  }

  // ---------- Plan darstellen ----------
  function art(titel, farbe) {
    const t = String(titel || '').toLowerCase();
    if (/gym|kraft/.test(t)) return 'gym';
    if (/bmx|track|gate|strecke/.test(t)) return 'track';
    if (/plyo|sprung/.test(t)) return 'plyo';
    if (/sprint/.test(t)) return 'sprint';
    const f = String(farbe || '').toLowerCase();
    return { '#d9ead3': 'gym', '#d0ece7': 'plyo', '#fff2cc': 'sprint', '#cfe2f3': 'track' }[f] || '';
  }
  function zerlege(h) {
    const r = { titel: '', saetze: '', ex: [] };
    h.zeilen.forEach((z, idx) => {
      const [s, u, w, p, pa] = z;
      if (s && !u && !w && !p && !pa && /^\d+$/.test(s)) { r.saetze = s; return; }
      if (u && !s && !w && !p && !pa) { if (!r.titel && !r.ex.length) r.titel = u; else r.ex.push({ note: u, idx: idx }); return; }
      r.ex.push({ s: s, u: u, w: w, p: p, pa: pa, idx: idx });
    });
    if (!r.titel && r.ex.length) r.titel = 'Training';
    r.art = art(r.titel, h.farbe);
    return r;
  }
  // Übungsvideo aus dem Reiter "Übungsvideos" (längstes passendes Stichwort gewinnt)
  function uebName(u) {
    const x = String(u || '').toLowerCase().replace(/\s+/g, ' ');
    const v = (S.d.uebungsvideos || []).filter(v => x.includes(v.wort.toLowerCase().replace(/\s+/g, ' '))).sort((a, b) => b.wort.length - a.wort.length)[0];
    return v ? `<span>${esc(u)}</span><a class="play" href="${esc(v.link || 'https://www.youtube.com/results?search_query=' + encodeURIComponent(v.wort))}" target="_blank" rel="noopener" aria-label="Video ansehen"><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg></a>` : esc(u);
  }
  // Übung abhaken (nur auf diesem Handy, rutscht optisch in den Hintergrund)
  function abListe() {
    if (!S.ab) { try { S.ab = JSON.parse(localStorage.getItem('hs_ab_' + S.k) || '{}'); } catch (e) { S.ab = {}; } }
    return S.ab;
  }
  function abAttr(key) { return key ? ` data-ab="${esc(key)}"${abListe()[key] ? ' class="ab"' : ''}` : ''; }
  function abUmschalten(li) {
    const a = abListe(), k = li.dataset.ab, grenze = plusTage(S.d.heute, -14);
    if (a[k]) delete a[k]; else a[k] = 1;
    Object.keys(a).forEach(x => { if (x.slice(0, 10) < grenze) delete a[x]; });
    li.classList.toggle('ab', !!a[k]);
    try { localStorage.setItem('hs_ab_' + S.k, JSON.stringify(a)); } catch (e) {}
  }
  const vidKl = u => uebName(u).startsWith('<span>') ? ' mitvid' : '';
  const hatPlan = h => h && h.zeilen && h.zeilen.length > 0;
  function einheit(h, halb, mitZeit, t) {
    const z = zerlege(h), gym = t && istGym(z), zk = t ? t.datum + '|' + halb : '', oek = gym && S.zoek[zk], mf = messFelderHeute(h, t);

  function erledigtZeile(t, halb, titel) {

  // ---------- Messwerte im Tagesplan ----------

  // "10/5/9" bei 3 Sätzen → ['10', '5', '9']; "8" bei 4 Sätzen → 4 × '8'
  const wiederh = (w, s) => { const teile = String(w || '').split('/').map(x => x.trim()).filter(Boolean); const n = Math.max(Number(s) || 0, teile.length, 1); return Array.from({ length: n }, (_, i) => teile.length ? teile[Math.min(i, teile.length - 1)] : ''); };
  const fuenfer = r => /^5(\s*wh)?$/i.test(String(r).trim());

  function messFelder(h, w) {
    const out = [], add = (t, a, idx) => { if (t && !out.some(x => x.t === t)) out.push({ t: t, anlass: a, idx: idx }); };

    zeilen.forEach((l, i) => {

  // Morgens: Gewicht Mo/Mi/Sa, Größe am Monatsersten, Ruhepuls (nur erste 2 Wochen ab App-Start, jeden 2. Tag)

        <div class="row-btns"><button class="btn" type="button" data-ok="${esc(z)}">Ja, stimmt</button><button class="btn sec" type="button" data-fix="${esc(z)}">Korrigieren</button></div></div>` : ''}</div>`;

  // was keiner Übung zuzuordnen ist (z. B. aus dem Titel der Einheit), kommt ans Ende

  const heuteAktiv = t => t && t.datum === S.d.heute && S.tab === 'heute';

  // ---------- Zeitökonomisch: Sätze einzeln, Supersätze nach Hannes' Regeln ----------
  // Bis zur letzten Kniebeuge / Beinpresse / Kreuzheben bleibt alles der Reihe nach.
  // Danach: Unterkörper-Übung im Wechsel mit Oberkörper-Übung; übrige Drück- und Zugübungen im Wechsel.
  const HAUPT = /kniebeuge|back\s*squat|beinpresse|kreuzheben/;
  const UNTEN = /rückenstreck|beinbeuger|beinstreck|hip\s*thrust|hüft|wade|ausfallschritt|adduk|abduk|good\s*morning|step\s*-?\s*up|glute|kniebeuge|beinpresse|kreuzheben/;
  const ZUG = /rudern|\blat\b|lat\s*zug|latzug|klimmz|reverse\s*butterfly|face\s*pull|bizeps|curl|nackenheb|shrug|pull/;
  const DRUECK = /bankdr|schulterdr|liegestütz|dips|butterfly|brustpresse|trizeps|seitheben|frontheben|push/;
  const uebTyp = u => { const x = u.toLowerCase(); return UNTEN.test(x) ? 'unten' : ZUG.test(x) ? 'zug' : DRUECK.test(x) ? 'drueck' : ''; };
  const istGym = (z) => z.art === 'gym' || z.ex.some(e => e.u && (HAUPT.test(e.u.toLowerCase()) || uebTyp(e.u)));
  function zeitOek(z) {
    const ue = z.ex.map(e => e.note ? { note: e.note, idx: e.idx } : { u: e.u, e: e, typ: uebTyp(e.u || ''), saetze: wiederh(e.w, e.s).map((w, j) => ({ nr: j + 1, w: w })) });

    const partner = new Map(), paar = (a, b) => { partner.set(a, b); partner.set(b, a); };

  // ---------- Dauer einer Einheit (Schätzung) ----------

  // ---------- Heute ----------
  // Aufgaben ganz oben auf Heute: Voice-Nachricht (Fr–So) und Videoanalyse. Abhaken = Effekt und weg.

  function viewHeute() {

    S.gezeigt = {};
    let html = aufgabenKarten();
    if (!f) return html + '<div class="card"><div class="empty">Für diese Woche gibt es noch keinen Plan.</div></div>';
    const t = f.t;
    if (t.krank) html += '<div class="sick">Du hast dich für heute krank gemeldet. Gute Besserung!</div>';
    const mf = morgenFelder(f);
    if (mf.length) html += `<h2>Heute früh</h2><div class="card">${mf.map(x => heuteFeld(x[0], x[1])).join('')}</div>`;
    html += `<h2>Heute</h2><div class="card"><div class="card-h"><h3>${esc(t.tag)}</h3><small>${kurzDatum(t.datum)}</small></div>`;
    const plan = tagPlan(t, true);
    html += plan || '<div class="empty">Heute steht kein Training im Plan.</div>';
    html += '</div>';
    if (m) {
      html += `<h2>Morgen</h2><div class="card"><div class="card-h"><h3>${esc(m.t.tag)}</h3><small>${kurzDatum(m.t.datum)}</small></div>`;
      html += tagPlan(m.t, true) || '<div class="empty">Morgen steht noch kein Training im Plan.</div>';
      html += '</div>';
    }
    if (S.d.rechte.befinden) html += befindenKarte(f);
    if (S.d.rechte.krank) html += `<div class="card"><label class="switch" for="krank"><span><b>Ich bin heute krank</b><br><span class="muted">Hannes sieht es sofort.</span></span><input type="checkbox" id="krank" ${t.krank ? 'checked' : ''}></label>
      <label class="switch" for="nichtgut"><span><b>Ich fühle mich nicht gut</b><br><span class="muted">Hannes sieht es sofort.</span></span><input type="checkbox" id="nichtgut" class="warn" ${(S.d.befinden || {})[heute] ? 'checked' : ''}></label></div>`;
    const v = S.d.daten[f.w.name].video;
    if (v && /^https?:\/\//.test(v)) html += `<div class="card"><div class="card-h"><h3>Video-Analyse</h3></div><a class="link" href="${esc(v)}" target="_blank" rel="noopener">Video von Hannes ansehen</a></div>`;
    html += `<img class="logo" src="logo.png" alt="High Spirit Strength and Conditioning, Hannes Slavik">`;
    return html;
  }
  function befindenKarte(f) {
    const b = f.t.befinden;
    return `<h2>Wie geht's dir?</h2><form class="card" id="befinden">
      <label class="field" for="kommentar"><span>Kommentar <span class="muted">(freiwillig)</span></span><textarea class="mine-in" id="kommentar" placeholder="Wie lief das Training?">${esc(b.kommentar)}</textarea></label>
      <button class="btn" type="submit">Speichern</button>
    </form>`;
  }

  // ---------- Woche ----------
  function wochenChips(aktiv, id) {
    return `<div class="chips" role="group" aria-label="Woche wählen">${S.d.wochen.map((w, i) =>
      `<button class="chip" data-${id}="${esc(w.name)}" aria-pressed="${w.name === aktiv}">${i === 0 ? 'Diese Woche' : i === 1 ? 'Nächste' : 'ab ' + esc(w.name) + '.'}</button>`).join('')}</div>`;
  }
  function kurzSlot(h, halb) {
    if (hatPlan(h)) { const z = zerlege(h); return `<div class="slot"><span class="h">${halb}</span><i class="${z.art}"></i><span class="t">${esc(z.titel)}${z.saetze ? ' · ' + esc(z.saetze) + ' Sätze' : ''}</span></div>`; }
    return `<div class="slot muted"><span class="h">${halb}</span><span class="t">${h.zeit ? esc(wahlKurz(h.zeit)) : '–'}</span></div>`;
  }
  function viewWoche() {
    const w = S.d.daten[S.wocheW];
    let html = `<h2>Wochenplan</h2>${wochenChips(S.wocheW, 'ww')}`;
    if (!w) return html + '<div class="loading">Lade Woche …</div>';
    if (w.alt) return html + '<div class="card"><div class="empty">Diese Woche ist noch im alten Format. Schau bitte in die Tabelle.</div></div>';
    const leer = w.tage.every(t => !hatPlan(t.vm) && !hatPlan(t.nm));
    if (leer) html += '<div class="card"><div class="empty">Hannes hat für diese Woche noch keinen Plan eingetragen. Trag unter „Zeiten“ ein, wann du kannst.</div></div>';
    html += w.tage.map((t, i) => {
      const key = w.name + '|' + i, offen = !!S.offen[key];
      const heute = t.datum === S.d.heute;
      const inhalt = tagPlan(t, true);
      return `<section class="day ${heute ? 'today' : ''} ${offen ? 'open' : ''}">
        <button type="button" data-day="${esc(key)}" aria-expanded="${offen}">
          <div class="dnum"><b>${TAGE_KURZ[i]}</b><span>${isoDate(t.datum).getDate()}</span></div>
          <div class="slots">${kurzSlot(t.vm, 'VM')}${kurzSlot(t.nm, 'NM')}${t.krank ? '<div><span class="tag">krank</span></div>' : ''}</div>
          <span class="chev" aria-hidden="true">›</span>
        </button>
        ${offen ? `<div class="day-body">${inhalt || '<div class="empty">Kein Training geplant.</div>'}</div>` : ''}
      </section>`;
    }).join('');
    return html;
  }

  // ---------- Zeiten ----------
  function viewZeiten() {
    let html = `<h2>Wann hast du Zeit?</h2><div class="card"><div class="muted">Tipp auf jeden Vor- und Nachmittag und wähl aus: keine Zeit, angeleitetes Training oder High-Spirit-Training. Für die nächste Woche bitte bis Samstag 18 Uhr.</div></div>${wochenChips(S.wocheZ, 'wz')}`;
    const w = S.d.daten[S.wocheZ];
    if (!w) return html + '<div class="loading">Lade Woche …</div>';
    if (w.alt) return html + '<div class="card"><div class="empty">Diese Woche ist noch im alten Format.</div></div>';
    if (!S.d.rechte.zeiten) return html + '<div class="card"><div class="empty">Zeiten eintragen ist für dich gerade nicht freigeschaltet.</div></div>';
    stdAuto(w);
    if (stdMerk().wochen[w.name] === 2) html += '<div class="card"><div class="muted">Deine Standardwoche ist schon eingetragen. Tipp einzelne Halbtage an, um sie zu ändern, oder leer die Woche ganz.</div></div>';
    html += '<div class="card"><div class="grid"><div></div><div class="gh">Vormittag</div><div class="gh">Nachmittag</div>';
    zTage(w).forEach((t, i) => {
      html += t.folge
        ? `<div class="folge">Montag danach – zählt schon zur nächsten Woche. Bitte gleich mit eintragen.</div><div class="gd"><b>Mo</b><span>${kurzDatum(t.datum)}</span></div>`
        : `<div class="gd"><b>${TAGE_KURZ[i]}</b><span>${kurzDatum(t.datum)}</span></div>`;
      [['vm', 'Vormittag'], ['nm', 'Nachmittag']].forEach(([h, lang]) => {
        const s = t[h], v = s.zeit, geaendert = S.geaendert[w.name + '|' + s.zelle], a = wahlAnzeige(v);
        html += `<button type="button" class="cell ${a.kl} ${geaendert ? 'changed' : ''}" data-slot="${i}|${h}" aria-label="${esc(t.tag + ' ' + lang + ': ' + (v ? wahlKurz(v) : 'leer'))}">
          ${a.oben ? `<span class="o">${esc(a.oben)}</span>` : ''}<span class="v">${v ? esc(a.text) : '<span class="muted">auswählen</span>'}</span>${a.notiz ? `<span class="n">✎ ${esc(a.notiz)}</span>` : ''}${hatPlan(s) ? '<span class="p">Plan steht</span>' : ''}</button>`;
      });
    });
    html += '</div></div><div class="row-btns">';
    html += `<button class="btn wide" type="button" id="stdEin" ${S.d.standard && S.d.standard.some(Boolean) ? '' : 'disabled'}>Standardwoche einsetzen</button>`;
    html += '<button class="btn sec wide" type="button" id="stdSpeichern">Als Standardwoche speichern</button>';
    html += '<button class="btn sec wide" type="button" id="wocheLeeren">Woche leeren</button></div>';
    if (!S.d.standard || !S.d.standard.some(Boolean)) html += '<div class="muted">Noch keine Standardwoche gespeichert. Füll eine Woche aus und tippe auf „Als Standardwoche speichern“. Ab dann reicht ein Tipp pro Woche.</div>';
    return html;
  }
  // Was der Athlet pro Halbtag wählt. Gespeichert als Text im gelben Feld, z. B. "Angeleitet: BMX-Bahn, intensiv".
  // Mit Anmerkung für Hannes: "High Spirit: Gym | erst ab 17 Uhr"
  function wahlLesen(v) {
    const teile = String(v || '').split(' | '), s = teile[0].trim(), notiz = teile.slice(1).join(' | ').trim();
    if (!s) return { art: notiz ? 'frei' : '', text: '', notiz: notiz };
    if (/^keine/i.test(s)) return { art: 'keine', notiz: notiz };
    let m = s.match(/^Angeleitet:\s*([^,]+?)\s*(?:,\s*(.+))?$/i);
    if (m) return { art: 'angeleitet', was: m[1], int: m[2] || '', notiz: notiz };
    m = s.match(/^High Spirit:\s*(.+)$/i);
    if (m) return { art: 'hs', was: m[1].trim(), notiz: notiz };
    return { art: 'frei', text: s, notiz: notiz };
  }
  function wahlText(z) {
    const haupt = z.art === 'keine' ? 'Keine Zeit' : z.art === 'angeleitet' ? 'Angeleitet: ' + z.was + ', ' + z.int : z.art === 'hs' ? 'High Spirit: ' + z.was : z.text || '';
    return haupt + (z.notiz ? ' | ' + z.notiz : '');
  }
  const wahlFertig = z => z.art === 'keine' || z.art === 'frei' || (z.art === 'hs' && !!z.was) || (z.art === 'angeleitet' && !!z.was && !!z.int);
  function wahlAnzeige(v) {
    const w = wahlLesen(v), n = w.notiz || '';
    if (w.art === 'keine') return { kl: 'none', oben: '', text: 'Keine Zeit', notiz: n };
    if (w.art === 'angeleitet') return { kl: 'filled', oben: 'Angeleitet', text: w.was + (w.int ? ' · ' + w.int : ''), notiz: n };
    if (w.art === 'hs') return { kl: 'hs', oben: 'High Spirit', text: w.was, notiz: n };
    if (w.art === 'frei') return { kl: 'filled', oben: '', text: w.text, notiz: n };
    return { kl: '', oben: '', text: '', notiz: '' };
  }
  const wahlKurz = v => { const a = wahlAnzeige(v); return (a.oben ? a.oben + ': ' : '') + a.text + (a.notiz ? ' (' + a.notiz + ')' : ''); };
  // Zeiten: die 7 Tage plus der Montag danach (steht im Sheet am Ende der Woche, AK–AO)
  // Standardwoche: einmal eingesetzt, wird jede kommende Woche beim ersten Öffnen damit vorbelegt (leere Halbtage).
  // Danach frei änderbar oder leerbar, die Woche wird nicht nochmal befüllt. Merker nur auf diesem Handy.
  function stdMerk() {
    if (!S.std) { try { S.std = JSON.parse(localStorage.getItem('hs_std_' + S.k) || 'null'); } catch (e) {} S.std = S.std || { an: false, wochen: {} }; }
    return S.std;
  }
  function stdSichern() { try { localStorage.setItem('hs_std_' + S.k, JSON.stringify(S.std)); } catch (e) {} }
  function stdSetzen(w, nurLeere) {
    zTage(w).forEach((t, i) => ['vm', 'nm'].forEach((h, j) => {
      const wert = S.d.standard[(i % 7) * 2 + j] || '';
      if (nurLeere && t[h].zeit) return;
      if (t[h].zeit !== wert) { t[h].zeit = wert; S.geaendert[w.name + '|' + t[h].zelle] = true; merken(w.name, t[h].zelle, wert); }
    }));
  }
  function stdAuto(w) {
    const m = stdMerk();
    if (!m.an || m.wochen[w.name] || !S.d.standard || !S.d.standard.some(Boolean) || !w.tage.length || w.tage[0].datum <= S.d.heute) return;
    m.wochen[w.name] = 2; stdSichern(); stdSetzen(w, true);
  }
  const zTage = w => w.folgeMontag ? w.tage.concat([w.folgeMontag]) : w.tage;
  function slotEditor(i, h, z) {
    const w = S.d.daten[S.wocheZ], t = zTage(w)[i], s = t[h], vm = h === 'vm';
    z = z || wahlLesen(s.zeit);
    const knopf = (attr, wert, label, an) => `<button type="button" ${attr}="${esc(wert)}" aria-pressed="${!!an}">${esc(label)}</button>`;
    let html = `<h3 id="sh">${esc(t.tag)} ${t.folge ? kurzDatum(t.datum) + ' ' : ''}${vm ? 'Vormittag' : 'Nachmittag'}</h3>
      <div class="wahl">${knopf('data-art', 'keine', 'Keine Zeit', z.art === 'keine')}${knopf('data-art', 'angeleitet', 'Angeleitetes Training', z.art === 'angeleitet')}${knopf('data-art', 'hs', 'High-Spirit-Training', z.art === 'hs')}</div>`;
    if (z.art === 'angeleitet') {
      html += `<div class="field"><span>Wo?</span><div class="feel">${ANGELEITET.map(x => knopf('data-was', x, x, z.was === x)).join('')}</div></div>`;
      if (z.was) html += `<div class="field"><span>Wie intensiv?</span><div class="feel">${INTENSITAET.map(x => knopf('data-int', x, x, z.int === x)).join('')}</div></div>`;
    }
    if (z.art === 'hs') html += `<div class="field"><span>Wunschtraining</span><div class="feel">${WUNSCH.map(x => knopf('data-was', x, x, z.was === x)).join('')}</div></div>`;
    html += `<label class="field" for="anm"><span>Anmerkung für Hannes <span class="muted">(freiwillig)</span></span><input class="mine-in" id="anm" maxlength="80" autocomplete="off" placeholder="z. B. erst ab 17 Uhr" value="${esc(z.notiz || '')}"></label>
      <button class="btn" type="button" id="ok" ${wahlFertig(z) ? '' : 'disabled'}>Übernehmen</button>
      <div class="row-btns"><button class="btn sec wide" type="button" data-leer>Feld leeren</button><button class="btn sec wide" type="button" id="zu">Abbrechen</button></div>`;
    $('#overlay').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="wrap">${html}</div></div></div>`;
    const zu = () => { $('#overlay').innerHTML = ''; };
    const notiz = () => $('#anm').value.replace(/\|/g, '/').trim();
    $('#scrim').addEventListener('click', e => {
      if (e.target.id === 'scrim' || e.target.id === 'zu') return zu();
      if (e.target.closest('[data-leer]')) { setzeZeit(w, s, ''); return zu(); }
      if (e.target.id === 'ok') { z.notiz = notiz(); setzeZeit(w, s, wahlText(z)); return zu(); }
      const art = e.target.closest('[data-art]');
      if (art) { const a = art.dataset.art; return slotEditor(i, h, a === z.art ? Object.assign(z, { notiz: notiz() }) : { art: a, was: '', int: '', notiz: notiz() }); }
      const was = e.target.closest('[data-was]');
      if (was) return slotEditor(i, h, Object.assign(z, { was: was.dataset.was, notiz: notiz() }));
      const int = e.target.closest('[data-int]');
      if (int) return slotEditor(i, h, Object.assign(z, { int: int.dataset.int, notiz: notiz() }));
    });
  }
  function setzeZeit(w, s, wert) {
    if (s.zeit === wert) return;
    s.zeit = wert; S.geaendert[w.name + '|' + s.zelle] = true;
    // Montag steht doppelt (Ende dieser Woche / Anfang der nächsten): geladene Kopie gleich mitziehen, das Sheet macht das Skript
    ['vm', 'nm'].forEach(h => Object.values(S.d.daten || {}).forEach(x => {
      if (!x || x === w || !x.tage) return;
      if (w.folgeMontag && s === w.folgeMontag[h] && x.tage[0].datum === w.folgeMontag.datum) x.tage[0][h].zeit = wert;
      if (s === w.tage[0][h] && x.folgeMontag && x.folgeMontag.datum === w.tage[0].datum) x.folgeMontag[h].zeit = wert;
    }));
    merken(w.name, s.zelle, wert); render();
  }

  // ---------- Termine ----------
  const tageBis = iso => Math.round((isoDate(iso) - isoDate(S.d.heute)) / 86400000);
  function viewTermine() {
    let html = '<h2>Meine Termine</h2>';
    if (!S.d.rechte.termine) return html + '<div class="card"><div class="empty">Termine eintragen ist für dich gerade nicht freigeschaltet.</div></div>';
    html += '<div class="card"><div class="muted">Trag deine Rennen, Camps und sonstigen Termine ein. So kann Hannes dein Training darauf abstimmen.</div><button class="btn" type="button" id="neuTermin">+ Termin eintragen</button></div>';
    const alle = (S.d.termine || []).slice().sort((x, y) => x.von < y.von ? -1 : x.von > y.von ? 1 : 0);
    const kommend = alle.filter(t => (t.bis || t.von) >= S.d.heute), vorbei = alle.filter(t => (t.bis || t.von) < S.d.heute).reverse().slice(0, 5);
    if (!kommend.length) html += '<div class="card"><div class="empty">Noch keine kommenden Termine.</div></div>';
    const naechstesTop = kommend.find(t => t.wichtig === 'Saison-Highlight');
    html += kommend.map(t => terminKarte(t, t === naechstesTop)).join('');
    if (vorbei.length) html += '<h2>Vorbei</h2>' + vorbei.map(t => terminKarte(t)).join('');
    return html;
  }
  function terminKarte(t, top) {
    const n = tageBis(t.von), laeuft = n < 0 && t.bis && t.bis >= S.d.heute;
    const wann = n > 1 ? 'in ' + n + ' Tagen' : n === 1 ? 'morgen' : n === 0 ? 'heute' : laeuft ? 'läuft' : '';
    const d = isoDate(t.von);
    const zeit = kurzDatum(t.von) + (t.bis && t.bis !== t.von ? '–' + kurzDatum(t.bis) : '');
    return `<button type="button" class="termin ${top ? 'hl' : ''} ${(t.bis || t.von) < S.d.heute ? 'vorbei' : ''}" data-termin="${esc(t.id)}">
      <div class="tdat"><b>${d.getDate()}</b><span>${MON_KURZ[d.getMonth()]}</span></div>
      <div class="tinfo"><span class="tart">${esc(t.art)}${terminStufen(t) ? ' · ' + esc(terminStufen(t)) : ''}</span><b>${esc(t.name)}</b><span class="muted">${zeit}${t.notiz ? ' · ' + esc(t.notiz) : ''}</span></div>
      <div class="tcount">${wann}</div></button>`;
  }
  function terminEditor(t) {
    const neu = !t.id;
    const knopf = (attr, wert, label, an) => `<button type="button" ${attr}="${esc(wert)}" aria-pressed="${!!an}">${esc(label)}</button>`;
    let html = `<h3 id="sh">${neu ? 'Neuer Termin' : 'Termin ändern'}</h3>
      <div class="field"><span>Was?</span><div class="feel">${TERMIN_ARTEN.map(a => knopf('data-tart', a, a, t.art === a)).join('')}</div></div>
      <label class="field" for="tname"><span>Name</span><input class="mine-in" id="tname" maxlength="80" autocomplete="off" placeholder="${t.art === 'Rennen' ? 'z. B. Austria Cup Wien' : t.art === 'Sonstiges' ? 'z. B. Schulskikurs' : 'z. B. Camp Mallorca'}" value="${esc(t.name || '')}"></label>
      <div class="fromto"><label class="field" for="tvon"><span>Am / ab</span><input class="mine-in" type="date" id="tvon" value="${esc(t.von || '')}"></label><label class="field" for="tbis"><span>bis <span class="muted">(freiwillig)</span></span><input class="mine-in" type="date" id="tbis" value="${esc(t.bis || '')}"></label></div>`;
    if (mitWichtig(t.art)) html += `<div class="field"><span>Wie wichtig?</span><div class="feel">${TERMIN_WICHTIG.map(x => knopf('data-twichtig', x, x, t.wichtig === x)).join('')}</div></div>`;
    if (mitIntensitaet(t.art)) html += `<div class="field"><span>${t.art === 'Sonstiges' ? 'Wie anstrengend?' : 'Wie intensiv?'}</span><div class="feel">${TERMIN_INTENSITAET.map(x => knopf('data-tint', x, x, t.intensitaet === x)).join('')}</div></div>`;
    html += `<label class="field" for="tnotiz"><span>Anmerkung <span class="muted">(freiwillig)</span></span><input class="mine-in" id="tnotiz" maxlength="200" autocomplete="off" value="${esc(t.notiz || '')}"></label>
      <button class="btn" type="button" id="tok">Speichern</button>
      <div class="row-btns">${neu ? '' : '<button class="btn sec wide" type="button" id="tweg">Löschen</button>'}<button class="btn sec wide" type="button" id="zu">Abbrechen</button></div>`;
    $('#overlay').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="wrap">${html}</div></div></div>`;
    const zu = () => { $('#overlay').innerHTML = ''; };
    const lesen = () => Object.assign(t, { name: $('#tname').value.trim(), von: $('#tvon').value, bis: $('#tbis').value, notiz: $('#tnotiz').value.trim() });
    $('#scrim').addEventListener('click', e => {
      if (e.target.id === 'scrim' || e.target.id === 'zu') return zu();
      const a = e.target.closest('[data-tart]');
      if (a) { lesen(); t.art = a.dataset.tart; return terminEditor(t); }
      const wi = e.target.closest('[data-twichtig]');
      if (wi) { lesen(); t.wichtig = t.wichtig === wi.dataset.twichtig ? '' : wi.dataset.twichtig; return terminEditor(t); }
      const it = e.target.closest('[data-tint]');
      if (it) { lesen(); t.intensitaet = t.intensitaet === it.dataset.tint ? '' : it.dataset.tint; return terminEditor(t); }
      if (e.target.id === 'tok') {
        lesen();
        if (!t.art) return toast('Bitte wählen: Rennen, Camp oder Sonstiges.');
        if (!mitWichtig(t.art)) t.wichtig = '';
        if (!mitIntensitaet(t.art)) t.intensitaet = '';
        if (!t.name) return toast('Bitte einen Namen eintragen.');
        if (!t.von) return toast('Bitte ein Datum wählen.');
        if (t.bis && t.bis < t.von) return toast('Das Enddatum liegt vor dem Beginn.');
        zu(); terminSenden('termin', t); return;
      }
      if (e.target.id === 'tweg') { zu(); terminSenden('terminLoeschen', t); }
    });
  }
  function terminSenden(fn, t) {
    const vorher = (S.d.termine || []).slice();
    let liste = vorher.filter(x => x.id !== t.id);
    if (fn === 'termin') liste.push(Object.assign({}, t, { id: t.id || 'neu' + Date.now() }));
    S.d.termine = liste; render(); status('Speichert …');
    api(fn, S.k, fn === 'termin' ? t : t.id)
      .then(r => { if (Array.isArray(r)) { S.d.termine = r; render(); } status('Gespeichert', 'ok'); toast(echt ? (fn === 'termin' ? 'Termin gespeichert' : 'Termin gelöscht') : 'Vorschau: würde jetzt gespeichert'); })
      .catch(err => { S.d.termine = vorher; render(); status('Nicht gespeichert', 'err'); toast(err && err.message ? err.message : 'Nicht gespeichert'); });
  }

  // ---------- Werte ----------
  const normK = x => String(x || '').split(/\s{2,}/)[0].replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
  const schluessel = t => normK(t.bereich) + '|' + normK(t.name);
  // Anzeigename in der App; im Sheet bleibt der Name unverändert (Freigaben, Dashboard)
  const testName = n => {
    if (/^trittfrequenz bmx/i.test(String(n).trim())) return 'Trittfrequenz BMX-Bahn';
    const x = String(n).trim(), h = /hometrack|home-track/i.test(x) || /^gate/i.test(x);
    const kern = /^gate/i.test(x) ? 'Start (Gate)' : /first\s*straight/i.test(x) ? 'First Straight' : /half\s*-?\s*lap/i.test(x) ? 'Half-Lap' : /full\s*-?\s*lap/i.test(x) ? 'Full-Lap' : x;
    return h ? kern + ' · Home-Track' : kern;
  };
  const zahl = x => { const s = String(x || '').trim(), m = s.match(/^(\d{1,2}):(\d{2})$/); if (m) return Number(m[1]) + Number(m[2]) / 60; const n = Number(s.replace(',', '.')); return s && isFinite(n) ? n : null; };
  const deZahl = (n, st) => n.toLocaleString('de-DE', { maximumFractionDigits: st == null ? 2 : st });
  const niedrigerBesser = e => /sek|min\s*\//i.test(e);
  const titel = b => b.charAt(0) + b.slice(1).toLowerCase().replace(/& t/, '& T');
  const einheitKurz = e => String(e).replace(/\s*\(.*\)/, '');

  function viewWerte() {
    const f = finde(S.d.heute);
    if (!f) return '<div class="card"><div class="empty">Keine Woche gefunden.</div></div>';
    const w = f.w;
    if (S.verlauf === undefined) { S.verlauf = null; api('verlauf', S.k).then(v => { S.verlauf = v || {}; if (S.tab === 'werte') render(); }).catch(() => { S.verlauf = {}; }); }
    let html = `<h2>Meine Werte</h2><div class="card"><div class="muted">Woche ab ${esc(w.name)}. Deine Werte trägst du direkt unter <b>Heute</b> im Trainingsplan ein, sobald sie dran sind. Hier trägst du nur noch das <b>Wattbike</b> ein. Tipp auf <b>Verlauf</b>, um zu sehen, wie du dich entwickelst.</div></div>`;
    if (!w.tests.length) return html + '<div class="card"><div class="empty">Hannes hat dir noch keine Werte zum Eintragen freigegeben.</div></div>';
    const gruppen = [];
    // Ruhe- und Maximalpuls stehen in der Tabelle bei den Körperdaten, in der App als eigene Gruppe ganz unten
    w.tests.forEach(t => { const b = /puls/i.test(t.name) ? 'PULS' : t.bereich; let g = gruppen.find(x => x.b === b); if (!g) gruppen.push(g = { b: b, z: b === t.bereich ? t.zusatz : '', t: [] }); g.t.push(t); });
    gruppen.sort((x, y) => (x.b === 'PULS') - (y.b === 'PULS'));
    gruppen.forEach(g => {
      html += `<div class="card group"><div class="card-h"><h3>${esc(titel(g.b))}</h3>${g.z ? `<small>${esc(g.z)}</small>` : ''}</div>`;
      g.t.forEach(t => {
        const id = 'v_' + t.zelle, pace = /pace/i.test(t.name), k = schluessel(t), offen = S.chartOffen === k;
        const last = t.zuletzt ? `Zuletzt: ${esc(t.zuletzt)} ${esc(einheitKurz(t.einheit))} (Woche ${esc(t.zuletztWoche)})` : 'Noch kein früherer Wert';
        const p = S.pruef[t.zelle], frei = /wattbike/i.test(t.bereich);
        html += `<div class="val"><label for="${id}">${esc(testName(t.name))}${t.info ? `<small>${esc(t.info)}</small>` : ''}</label>
          <div class="inp">${frei ? `<input id="${id}" data-test="${esc(t.zelle)}" inputmode="decimal" placeholder="–" value="${esc(p ? p.neu : t.wert)}" autocomplete="off">` : `<span class="ro">${esc(t.wert) || '–'}</span>`}</div>
          <div class="unit-l">${esc(t.einheit)}</div>
          <div class="last"><span>${last}</span><button type="button" class="vbtn" data-chart="${esc(k)}" aria-expanded="${offen}">${offen ? 'Verlauf zu' : 'Verlauf'}</button></div>
          ${frei && p ? `<div class="check" role="alert"><b>Stimmt das?</b> Letztes Mal ${esc(p.ref)}, jetzt ${esc(p.neu)} ${esc(einheitKurz(t.einheit))}. Das ist ein großer Sprung.
            <div class="row-btns"><button class="btn" type="button" data-ok="${esc(t.zelle)}">Ja, stimmt</button><button class="btn sec" type="button" data-fix="${esc(t.zelle)}">Korrigieren</button></div></div>` : ''}
          ${offen ? `<div class="chart">${chartBox(t, k)}</div>` : ''}</div>`;
      });
      w.hinweise.filter(h => h.bereich === g.b).forEach(h => { html += `<div class="hint">${esc(h.text)}</div>`; });
      html += '</div>';
    });
    return html;
  }

  /** Verlauf eines einzelnen Werts: nur Linie, Start und jetzt. Umschalter Messwert / Prozent. */
  function chartBox(t, k) {
    if (S.verlauf === null) return '<div class="muted">Lade Verlauf …</div>';
    const pts = ((S.verlauf || {})[k] || []).map(x => ({ w: x.woche, v: zahl(x.wert), roh: x.wert })).filter(x => x.v !== null);
    if (pts.length < 2) return '<div class="muted">Ab dem zweiten Test siehst du hier, wie du dich entwickelst.</div>';
    const modus = S.modus[k] || 'wert', lb = niedrigerBesser(t.einheit) || /ruhepuls/i.test(t.name), e = einheitKurz(t.einheit);
    const first = pts[0].v, lastP = pts[pts.length - 1];
    const ys = pts.map(p => modus === 'prozent' ? (lb ? -1 : 1) * (p.v / first - 1) * 100 : p.v);
    const besser = lb ? lastP.v < first : lastP.v > first, gleich = lastP.v === first;
    const diff = modus === 'prozent' ? ys[ys.length - 1] : lastP.v - first;
    const diffText = modus === 'prozent' ? (diff > 0 ? '+' : '') + deZahl(diff, 1) + ' %' : (diff > 0 ? '+' : '') + deZahl(diff) + ' ' + e;
    const W = 320, H = 130, L = 10, R = 10, T = 24, B = 22;
    let lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
    if (modus === 'prozent') { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (hi === lo) { hi += 1; lo -= 1; }
    // bei "niedriger ist besser" (Zeiten) im Messwert-Modus Achse drehen, damit oben immer besser ist
    const flip = modus === 'wert' && lb;
    const x = i => L + (W - L - R) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
    const y = v => { const r = (v - lo) / (hi - lo); return T + (H - T - B) * (flip ? r : 1 - r); };
    const linie = ys.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const flaeche = linie + ` L${x(ys.length - 1).toFixed(1)} ${H - B} L${x(0).toFixed(1)} ${H - B} Z`;
    const lab = (i, txt, anker) => `<text x="${x(i).toFixed(1)}" y="${(y(ys[i]) - 9).toFixed(1)}" text-anchor="${anker}" class="cl">${esc(txt)}</text>`;
    const wertLab = i => modus === 'prozent' ? (i === 0 ? 'Start' : (ys[i] > 0 ? '+' : '') + deZahl(ys[i], 1) + ' %') : pts[i].roh + ' ' + e;
    const neutral = /maximalpuls/i.test(t.name);   // höher ist hier nicht automatisch besser
    return `<div class="chart-h"><span class="delta ${gleich || neutral ? '' : besser ? 'up' : 'down'}">${gleich ? 'gleich wie am Anfang' : diffText + ' seit ' + esc(pts[0].w) + '.'}</span>
      <div class="seg" role="group" aria-label="Anzeige"><button type="button" data-modus="${esc(k)}|wert" aria-pressed="${modus === 'wert'}">${esc(e)}</button><button type="button" data-modus="${esc(k)}|prozent" aria-pressed="${modus === 'prozent'}">%</button></div></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf ${esc(testName(t.name))}">
        ${modus === 'prozent' ? `<line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" class="c0"/>` : ''}
        <path d="${flaeche}" class="ca"/><path d="${linie}" class="cline"/>
        ${ys.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === ys.length - 1 ? 5 : 3}" class="${i === ys.length - 1 ? 'cdot end' : 'cdot'}"/>`).join('')}
        ${lab(0, wertLab(0), 'start')}${lab(ys.length - 1, wertLab(ys.length - 1), 'end')}
        <text x="${L}" y="${H - 5}" class="cx">${esc(pts[0].w)}.</text><text x="${W - R}" y="${H - 5}" text-anchor="end" class="cx">${esc(lastP.w)}.</text>
      </svg>`;
  }

  // ---------- Speichern (gesammelt, kurz verzögert) ----------
  function merken(woche, zelle, wert) {
    (S.wartet[woche] = S.wartet[woche] || {})[zelle] = wert;
    status('Speichert …');
    clearTimeout(S.timer);
    S.timer = setTimeout(senden, 700);
  }
  function senden() {
    const jobs = Object.keys(S.wartet).map(woche => {
      const a = S.wartet[woche]; delete S.wartet[woche];
      const liste = Object.keys(a).map(z => ({ zelle: z, wert: a[z], hinweis: S.hinweise[z] || '', datum: (S.meta[z] || {}).datum || '', anlass: (S.meta[z] || {}).anlass || '' }));
      liste.forEach(x => { delete S.hinweise[x.zelle]; delete S.meta[x.zelle]; });
      return api('speichern', S.k, woche, liste).catch(e => { S.wartet[woche] = Object.assign(a, S.wartet[woche] || {}); throw e; });
    });
    Promise.all(jobs).then(() => { status('Gespeichert', 'ok'); toast(echt ? 'Gespeichert' : 'Vorschau: würde jetzt gespeichert'); })
      .catch(e => { status('Nicht gespeichert', 'err'); toast((e && e.message ? e.message : 'Keine Verbindung') + ' Tipp oben zum nochmal Versuchen.'); });
  }
  function status(text, art) {
    const el = $('#status'); el.hidden = false; el.textContent = text;
    el.className = 'status' + (art === 'err' ? ' err' : '');
    el.onclick = art === 'err' ? senden : null;
    if (art === 'ok') setTimeout(() => { if (el.textContent === text) el.hidden = true; }, 2500);
  }
  let toastT;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }

  // ---------- Ablauf ----------
  function laden(name) {
    if (S.d.daten[name]) return;
    api('woche', S.k, name).then(w => {
      // Montag schon in der Vorwoche eingetragen, aber noch nicht gespeichert angekommen? Dann den nehmen.
      if (w && w.tage) Object.values(S.d.daten).forEach(x => { if (x && x.folgeMontag && x.folgeMontag.datum === w.tage[0].datum) ['vm', 'nm'].forEach(h => { if (x.folgeMontag[h].zeit && !w.tage[0][h].zeit) w.tage[0][h].zeit = x.folgeMontag[h].zeit; }); });
      S.d.daten[name] = w; render(); }).catch(e => { toast(e.message || 'Woche konnte nicht geladen werden.'); });
  }
  function render() {
    const v = $('#view');
    if (S.tab === 'woche') laden(S.wocheW);
    if (S.tab === 'zeiten') laden(S.wocheZ);
    v.innerHTML = { heute: viewHeute, woche: viewWoche, zeiten: viewZeiten, termine: viewTermine, werte: viewWerte }[S.tab]();
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  }

  document.addEventListener('click', e => {
    const tab = e.target.closest('.tabs button');
    if (tab) { S.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
    const ww = e.target.closest('[data-ww]'); if (ww) { S.wocheW = ww.dataset.ww; render(); return; }
    const wz = e.target.closest('[data-wz]'); if (wz) { S.wocheZ = wz.dataset.wz; render(); return; }
    const day = e.target.closest('[data-day]'); if (day) { S.offen[day.dataset.day] = !S.offen[day.dataset.day]; render(); return; }
    const slot = e.target.closest('[data-slot]'); if (slot) { const [i, h] = slot.dataset.slot.split('|'); slotEditor(Number(i), h); return; }
    const ch = e.target.closest('[data-chart]'); if (ch) { S.chartOffen = S.chartOffen === ch.dataset.chart ? '' : ch.dataset.chart; render(); return; }
    const mo = e.target.closest('[data-modus]'); if (mo) { const d = mo.dataset.modus, i = d.lastIndexOf('|'), k = d.slice(0, i), m = d.slice(i + 1); S.modus[k] = m; render(); return; }
    const ok = e.target.closest('[data-ok]');
    if (ok) { const z = ok.dataset.ok, f = finde(S.d.heute), t = f.w.tests.find(x => x.zelle === z), p = S.pruef[z]; delete S.pruef[z];
      testSpeichern(f, t, p.neu, 'vorher ' + p.ref + ', Athlet hat bestätigt'); return; }
    const pc = e.target.closest('[data-pace]'); if (pc) { paceEditor(pc); return; }
    const abz = e.target.closest('[data-ab]'); if (abz && !e.target.closest('a, button, input, label')) { abUmschalten(abz); return; }
    const zo = e.target.closest('[data-zoek]'); if (zo) { S.zoek[zo.dataset.zoek] = !S.zoek[zo.dataset.zoek]; render(); return; }
    const fl = e.target.closest('[data-flach]');
    if (fl) { const f = finde(S.d.heute), t = f.w.tests.find(x => x.zelle === fl.dataset.flach), key = S.d.heute + '|' + schluessel(t);
      S.d.messwerte = S.d.messwerte || {}; const mw = S.d.messwerte[key] = S.d.messwerte[key] || {}, alt = mw.flach;
      mw.flach = alt === 'ja' ? 'nein' : 'ja'; render(); status('Speichert …');
      api('flach', S.k, S.d.heute, t.bereich, t.name, mw.flach === 'ja')
        .then(() => { status('Gespeichert', 'ok'); toast(echt ? 'Gespeichert' : 'Vorschau: würde jetzt gespeichert'); })
        .catch(err => { mw.flach = alt; render(); status('Nicht gespeichert', 'err'); toast(err && err.message ? err.message : 'Nicht gespeichert'); });
      return; }
    const sb = e.target.closest('[data-std]');
    if (sb) { const f = finde(S.d.heute), t = f.w.tests.find(x => x.zelle === sb.dataset.std), alt = t.bedingung;
      t.bedingung = !alt; render(); status('Speichert …');
      api('bedingung', S.k, f.w.name, t.bereich, t.name, t.bedingung)
        .then(() => { status('Gespeichert', 'ok'); toast(echt ? 'Gespeichert' : 'Vorschau: würde jetzt gespeichert'); })
        .catch(err => { t.bedingung = alt; render(); status('Nicht gespeichert', 'err'); toast(err && err.message ? err.message : 'Nicht gespeichert'); });
      return; }
    const ab = e.target.closest('[data-abhaken]'); if (ab) { abhaken(ab.dataset.abhaken); return; }
    if (e.target.id === 'neuTermin') { terminEditor({ art: '', name: '', von: '', bis: '', wichtig: '', intensitaet: '', notiz: '' }); return; }
    const tm = e.target.closest('[data-termin]');
    if (tm) { const t = (S.d.termine || []).find(x => x.id === tm.dataset.termin); if (t) terminEditor(Object.assign({}, t)); return; }
    const dn = e.target.closest('[data-done]');
    if (dn) {
      const [datum, halb, id] = dn.dataset.done.split('|'), key = datum + '|' + halb;
      S.d.erledigt = S.d.erledigt || {};
      const alt = S.d.erledigt[key] || '', neu = alt === id ? '' : id;
      S.d.erledigt[key] = neu; render(); status('Speichert …');
      api('erledigt', S.k, datum, halb, dn.dataset.titel, neu)
        .then(() => { status('Gespeichert', 'ok'); toast(echt ? 'Gespeichert' : 'Vorschau: würde jetzt gespeichert'); })
        .catch(err => { S.d.erledigt[key] = alt; render(); status('Nicht gespeichert', 'err'); toast(err && err.message ? err.message : 'Nicht gespeichert'); });
      return;
    }
    const fix = e.target.closest('[data-fix]');
    if (fix) { const z = fix.dataset.fix; delete S.pruef[z]; render(); const inp = document.getElementById('v_' + z) || document.getElementById('h_' + z); if (inp) { inp.focus(); inp.select(); } return; }
    if (e.target.id === 'stdEin') {
      const w = S.d.daten[S.wocheZ], m = stdMerk();
      stdSetzen(w, false); m.an = true; m.wochen[w.name] = 1; stdSichern();
      render(); toast('Standardwoche eingesetzt. Ab jetzt steht sie in jeder neuen Woche schon drin.'); return;
    }
    if (e.target.id === 'wocheLeeren') {
      const w = S.d.daten[S.wocheZ];
      if (!confirm('Alle Halbtage dieser Woche leeren?')) return;
      zTage(w).forEach(t => ['vm', 'nm'].forEach(h => { if (t[h].zeit) { t[h].zeit = ''; S.geaendert[w.name + '|' + t[h].zelle] = true; merken(w.name, t[h].zelle, ''); } }));
      stdMerk().wochen[w.name] = 1; stdSichern(); render(); toast('Woche geleert'); return;
    }
    if (e.target.id === 'stdSpeichern') {
      const w = S.d.daten[S.wocheZ], werte = [];
      w.tage.forEach(t => { werte.push(t.vm.zeit || ''); werte.push(t.nm.zeit || ''); });
      S.d.standard = werte; render();
      api('standardSpeichern', S.k, werte).then(() => toast('Als Standardwoche gespeichert')).catch(err => toast(err.message || 'Nicht gespeichert'));
    }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'krank') {
      const f = finde(S.d.heute); f.t.krank = e.target.checked;
      merken(f.w.name, f.t.krankZelle, e.target.checked); render(); return;
    }
    if (e.target.id === 'nichtgut') {
      const an = e.target.checked, heute = S.d.heute; S.d.befinden = S.d.befinden || {};
      const alt = S.d.befinden[heute]; if (an) S.d.befinden[heute] = 'nicht gut'; else delete S.d.befinden[heute];
      render(); status('Speichert …');
      api('befinden', S.k, heute, 'nicht gut', an)
        .then(() => { status('Gespeichert', 'ok'); toast(an ? 'Gute Besserung!' : 'Gespeichert'); })
        .catch(err => { if (alt) S.d.befinden[heute] = alt; else delete S.d.befinden[heute]; render(); status('Nicht gespeichert', 'err'); toast(err && err.message ? err.message : 'Nicht gespeichert'); });
      return;
    }
    const zh = e.target.dataset && e.target.dataset.heute;
    if (zh) {
      const wert = e.target.value.trim();
      if (wert && !/^\d+([.,]\d+)?$|^\d{1,2}:\d{2}$/.test(wert)) { toast('Bitte nur eine Zahl eintragen, z. B. 62,5'); return; }
      const f = finde(S.d.heute), t = f.w.tests.find(x => x.zelle === zh), alt = ((S.d.messwerte || {})[S.d.heute + '|' + schluessel(t)] || {}).wert || '';
      if (alt === wert) { delete S.pruef[zh]; render(); return; }
      S.meta[zh] = { datum: S.d.heute, anlass: e.target.dataset.anlass || '' };
      const ref = alt || t.wert || t.zuletzt, a = zahl(ref), n = zahl(wert);
      const g = S.d.grenzen ? (S.d.grenzen[schluessel(t)] != null ? S.d.grenzen[schluessel(t)] : S.d.grenzen.standard) : 25;
      if (wert && a && n !== null && Math.abs(n - a) / a * 100 > g) { S.pruef[zh] = { neu: wert, ref: ref }; render(); return; }
      delete S.pruef[zh]; testSpeichern(f, t, wert, '');
      return;
    }
    const z = e.target.dataset && e.target.dataset.test;
    if (z) {
      const wert = e.target.value.trim();
      if (wert && !/^\d+([.,]\d+)?$|^\d{1,2}:\d{2}$/.test(wert)) { toast('Bitte nur eine Zahl eintragen, z. B. 62,5'); return; }
      const f = finde(S.d.heute), t = f.w.tests.find(x => x.zelle === z);
      if (t.wert === wert) { delete S.pruef[z]; render(); return; }
      // Tippfehler-Schutz: großer Sprung zum letzten Wert? Erst nachfragen, dann speichern.
      const ref = t.wert || t.zuletzt, a = zahl(ref), n = zahl(wert);
      const g = S.d.grenzen ? (S.d.grenzen[schluessel(t)] != null ? S.d.grenzen[schluessel(t)] : S.d.grenzen.standard) : 25;
      if (wert && a && n !== null && Math.abs(n - a) / a * 100 > g) { S.pruef[z] = { neu: wert, ref: ref }; render(); return; }
      delete S.pruef[z]; testSpeichern(f, t, wert, '');
    }
  });
  // Pace (min:sek) per Drehrad statt Tastatur: links Minuten, rechts Sekunden
  function paceEditor(inp) {
    const f = finde(S.d.heute), t = f.w.tests.find(x => x.zelle === inp.dataset.pace);
    const m0 = String(inp.value || t.zuletzt || '').match(/^(\d{1,2}):(\d{2})/) || [0, /schwimm/i.test(t.name) ? '2' : '5', '00'];
    const MIN = Array.from({ length: 15 }, (_, i) => i + 1), SEK = Array.from({ length: 60 }, (_, i) => i);
    const rad = (id, liste, wert, fmt) => `<div class="rad" id="${id}" tabindex="0">${liste.map(x => `<div class="ri${x === wert ? ' an' : ''}">${fmt(x)}</div>`).join('')}</div>`;
    $('#overlay').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="wrap">
      <h3 id="sh">${esc(testName(t.name))}</h3><div class="muted">Mit dem Daumen drehen: links Minuten, rechts Sekunden (${esc(t.einheit)}).</div>
      <div class="raeder"><div class="fenster"></div>${rad('rm', MIN, Number(m0[1]), x => x)}<div class="dp">:</div>${rad('rs', SEK, Number(m0[2]), x => String(x).padStart(2, '0'))}</div>
      <button class="btn" type="button" id="ok">Übernehmen</button>
      <div class="row-btns"><button class="btn sec wide" type="button" data-leer>Feld leeren</button><button class="btn sec wide" type="button" id="zu">Abbrechen</button></div>
    </div></div></div>`;
    const H = 44, el = { m: $('#rm'), s: $('#rs') };
    el.m.scrollTop = (Math.min(15, Math.max(1, Number(m0[1]))) - 1) * H; el.s.scrollTop = Math.min(59, Number(m0[2])) * H;
    const index = r => Math.round(r.scrollTop / H);
    Object.values(el).forEach(r => r.addEventListener('scroll', () => { const i = index(r); [...r.children].forEach((c, j) => c.classList.toggle('an', j === i)); }, { passive: true }));
    const fertig = wert => { $('#overlay').innerHTML = ''; if (wert === null) return; inp.value = wert; inp.dispatchEvent(new Event('change', { bubbles: true })); };
    $('#scrim').addEventListener('click', e => {
      if (e.target.id === 'scrim' || e.target.id === 'zu') return fertig(null);
      if (e.target.closest('[data-leer]')) return fertig('');
      const ri = e.target.closest('.ri'); if (ri) { const r = ri.parentNode; r.scrollTo({ top: [...r.children].indexOf(ri) * H, behavior: 'smooth' }); return; }
      if (e.target.id === 'ok') return fertig(MIN[Math.min(MIN.length - 1, index(el.m))] + ':' + String(SEK[Math.min(59, index(el.s))]).padStart(2, '0'));
    });
  }
  function testSpeichern(f, t, wert, hinweis) {
    const alt = t.wert; t.wert = wert;
    const mt = S.meta[t.zelle];
    if (mt) { S.d.messwerte = S.d.messwerte || {}; const key = mt.datum + '|' + schluessel(t); S.d.messwerte[key] = Object.assign(S.d.messwerte[key] || {}, { wert: wert }); }
    if (wert && t.bedingung === false && !OHNE_BEDINGUNG.test(t.name)) setTimeout(() => toast('Gespeichert. Bitte noch bestätigen: Standardbedingungen erfüllt?'), 1600);
    S.hinweise[t.zelle] = hinweis;
    merken(f.w.name, t.zelle, wert);
    if (S.verlauf) {   // eigenen neuen Wert gleich im Verlauf zeigen
      const k = schluessel(t), liste = (S.verlauf[k] = (S.verlauf[k] || []).filter(x => x.woche !== f.w.name));
      if (wert) liste.push({ woche: f.w.name, datum: f.w.tage[0].datum, wert: wert });
    }
    render();
    return alt;
  }
  document.addEventListener('submit', e => {
    if (e.target.id !== 'befinden') return;
    e.preventDefault();
    const f = finde(S.d.heute), b = f.t.befinden, neu = $('#kommentar').value.trim();
    if (b.kommentar !== neu) { b.kommentar = neu; merken(f.w.name, b.zellen[3], neu); }
    if (!S.wartet[f.w.name]) toast('Nichts geändert');
  });

  function installHinweis() {
    const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
    const android = /Android/.test(ua);
    const app = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    let weg = false; try { weg = localStorage.getItem('hs_install_zu') === '1'; } catch (e) {}
    if (app || weg || (!ios && !android)) return;
    const schritte = ios
      ? ['Unten auf <b>Teilen</b> tippen (Quadrat mit Pfeil nach oben).', 'Runterscrollen, <b>„Zum Home-Bildschirm“</b> tippen.', 'Oben rechts <b>Hinzufügen</b> tippen. Fertig!', 'Kein Teilen-Symbol zu sehen? Dann den Link zuerst in <b>Safari</b> öffnen.']
      : ['Oben rechts auf die <b>drei Punkte ⋮</b> tippen.', '<b>„Installieren“</b> tippen.', 'Noch einmal <b>Installieren</b> bestätigen. Fertig!', 'Keine drei Punkte zu sehen? Dann den Link zuerst in <b>Chrome</b> öffnen.'];
    $('#installSchritte').innerHTML = schritte.map(s => '<li>' + s + '</li>').join('');
    $('#install').hidden = false;
    $('#installZu').onclick = () => { $('#install').hidden = true; try { localStorage.setItem('hs_install_zu', '1'); } catch (e) {} };
  }
  function los(d) {
    if (echt) installHinweis();
    S.d = d;
    if (!d.videos) d.videos = d.video ? [d.video] : [];   // älteres Skript liefert nur den ältesten Auftrag
    S.wocheW = d.wochen[0] ? d.wochen[0].name : '';
    S.wocheZ = d.wochen[1] ? d.wochen[1].name : S.wocheW;
    $('#hallo').textContent = 'Hallo ' + d.athlet;
    $('#datum').textContent = langDatum(d.heute);
    render();
  }
  function fehler(e) {
    $('#view').innerHTML = `<div class="card"><div class="card-h"><h3>Das hat nicht geklappt</h3></div><div>${esc(e && e.message ? e.message : e)}</div></div>`;
  }
  if (!echt) {
    $('#demo').hidden = false; S.k = 'vorschau'; api('start').then(los);
  } else {
    // Schlüssel aus dem Link merken, damit das Symbol auf dem Startbildschirm auch ohne ?k= funktioniert
    S.k = new URLSearchParams(location.search).get('k') || '';
    if (!S.k) { try { S.k = localStorage.getItem('hs_k') || ''; } catch (e) {} }
    // Schneller Start: sofort den zuletzt geladenen Stand von heute zeigen, im Hintergrund frisch laden
    let alt = null;
    try { alt = JSON.parse(localStorage.getItem('hs_start_' + S.k) || 'null'); } catch (e) {}
    if (alt && alt.heute === toIso(new Date())) { los(alt); status('Aktualisiere …'); } else alt = null;
    if (S.k) api('start', S.k).then(d => {
      try { localStorage.setItem('hs_k', S.k); localStorage.setItem('hs_start_' + S.k, JSON.stringify(d)); } catch (e) {}
      if (!alt) return los(d);
      // nur austauschen, wenn der Athlet in der Zwischenzeit nichts eingetragen hat und kein Fenster offen ist
      if (!S.bearbeitet && !$('#overlay').innerHTML) { const tab = S.tab, ww = S.wocheW, wz = S.wocheZ; los(d); S.tab = tab; if (d.daten[ww]) S.wocheW = ww; if (d.daten[wz]) S.wocheZ = wz; render(); }
      status('Aktuell', 'ok');
    }).catch(e => { if (alt) status('Offline: Stand von vorhin', 'err'); else fehler(e); });
    else fehler('Bitte öffne deinen persönlichen Link von Hannes (in Safari bzw. Chrome) und leg ihn von dort neu auf den Startbildschirm.');
  }
})();
</script>
